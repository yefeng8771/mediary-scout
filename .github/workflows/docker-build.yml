# yefeng8771 fork 新增：Docker 镜像自动构建 → GHCR
# 上游 fancydirty/mediary-scout 只有 Dockerfile + docker-compose 的本地 build，
# 没有发布任何预构建镜像。本 workflow 只新增、不改上游任何文件，
# 上游同步时零冲突。
#
# 产出两个镜像（compose 里仅有的两个自建服务）：
#   web     → ghcr.io/yefeng8771/mediary-scout
#   updater → ghcr.io/yefeng8771/mediary-scout-updater
# 其余服务（postgres / pansou / cloudflared）上游 compose 已用公开镜像，不处理。
name: docker-build

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # 每天 11:37 CST 兜底：若 main 已有新提交但 push 未触发构建
    # （如日后用 GITHUB_TOKEN 同步上游），当天也会打出新镜像；
    # 当前提交已打过则由下面的 skip 检查直接跳过，不重复构建。
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: ./Dockerfile
            image: ghcr.io/yefeng8771/mediary-scout
            build_args: |
              GIT_SHA=${{ github.sha }}
          - name: updater
            context: ./updater
            file: ./updater/Dockerfile
            image: ghcr.io/yefeng8771/mediary-scout-updater
            build_args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录后再查：GHCR 包默认 private，未登录查已存在的标签会误报不存在
      - name: 当前提交已打过镜像则跳过（定时触发去重）
        id: skip
        run: |
          TAG="${{ matrix.image }}:sha-$(git rev-parse --short HEAD)"
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "镜像 $TAG 已存在，跳过构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        if: steps.skip.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
